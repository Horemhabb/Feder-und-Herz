name: Bauen und veröffentlichen

# Baut bei jedem Push nach main die Web-, Mac- und Windows-Fassung von herz-und-feder-3d.
# Die Web-Fassung geht auf GitHub Pages (Adresse steht im Lauf unter „deploy“),
# Mac und Windows liegen als Artefakte zum Herunterladen am Lauf.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  PROJEKT: herz-und-feder-3d

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Godot und Exportvorlagen aus dem Zwischenspeicher
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web-mac-win

      - name: Godot und Exportvorlagen laden
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          V=$GODOT_VERSION
          B=https://github.com/godotengine/godot-builds/releases/download/$V-stable
          mkdir -p ~/godot
          curl -sSL -o g.zip $B/Godot_v$V-stable_linux.x86_64.zip
          unzip -q g.zip -d ~/godot && rm g.zip
          mv ~/godot/Godot_v$V-stable_linux.x86_64 ~/godot/godot
          curl -sSL -o t.tpz $B/Godot_v$V-stable_export_templates.tpz
          T=~/.local/share/godot/export_templates/$V.stable
          mkdir -p $T
          unzip -q -j t.tpz templates/version.txt templates/web_nothreads_release.zip templates/web_nothreads_debug.zip \
            templates/macos.zip templates/windows_release_x86_64.exe templates/windows_release_x86_64_console.exe -d $T
          rm t.tpz

      - name: Projekt importieren
        run: |
          ~/godot/godot --headless --path $PROJEKT --import || true
          ~/godot/godot --headless --path $PROJEKT --import

      - name: Exportieren
        run: |
          set -e
          mkdir -p $PROJEKT/build/web
          ~/godot/godot --headless --path $PROJEKT --export-release Web
          ~/godot/godot --headless --path $PROJEKT --export-release macOS
          ~/godot/godot --headless --path $PROJEKT --export-release Windows
          test -s $PROJEKT/build/web/index.pck
          test -s $PROJEKT/build/HerzUndFeder-Mac.zip
          test -s $PROJEKT/build/HerzUndFeder.exe
          touch $PROJEKT/build/web/.nojekyll
          ls -la $PROJEKT/build $PROJEKT/build/web

      - name: Mac-Fassung ablegen
        uses: actions/upload-artifact@v4
        with:
          name: HerzUndFeder-Mac
          path: ${{ env.PROJEKT }}/build/HerzUndFeder-Mac.zip
          compression-level: 0

      - name: Windows-Fassung ablegen
        uses: actions/upload-artifact@v4
        with:
          name: HerzUndFeder-Windows
          path: ${{ env.PROJEKT }}/build/HerzUndFeder.exe

      - name: Pages einrichten
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Web-Fassung für Pages ablegen
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PROJEKT }}/build/web

  deploy:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
