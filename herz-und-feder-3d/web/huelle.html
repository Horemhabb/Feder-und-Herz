	margin: 0; font-weight: normal; letter-spacing: .14em; font-size: clamp(30px, 6.2vw, 58px);

}
.leiste i {
	position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
	background: linear-gradient(to bottom, #f7e2a0, #d4a443 55%, #9b6f22);
	box-shadow: 0 0 10px rgba(255,200,90,.6); transition: width .25s ease-out;
}
.leiste.offen i { width: 35%; animation: wandern 1.4s ease-in-out infinite alternate; }
@keyframes wandern { from { left: -10%; } to { left: 75%; } }
.zeile { display: flex; justify-content: space-between; margin-top: .55em; font-size: 14px; letter-spacing: .08em; color: #c9b88e; }
#spruch { min-height: 2.6em; margin-top: .9em; font-size: clamp(13px, 2.1vw, 16px); line-height: 1.3; color: #d9c79a; font-style: italic; transition: opacity .5s; }

	position: absolute; top: max(14px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right)); z-index: 3;
	min-width: 44px; height: 44px; padding: 0 14px; border-radius: 22px; cursor: pointer;
	background: rgba(20,14,8,.72); border: 1px solid #8a6c34; color: #f0d58e;
	font-family: "Zier", Georgia, serif; font-size: 15px; letter-spacing: .08em;
	box-shadow: 0 0 12px rgba(240,190,90,.18); transition: opacity .4s;
}

	display: none; margin: 1em 0 0; padding: .9em 1em; border-radius: 8px;
	background: rgba(70,24,24,.92); border: 1px solid #b0503a; color: #f2e2c8;
	font-family: Georgia, serif; font-size: 15px; line-height: 1.35;
}

</head>
<body>
<canvas id="canvas">Dein Browser kann kein Canvas.</canvas>
<noscript>Dieses Spiel braucht JavaScript.</noscript>
<div id="status">
	<button id="ton" type="button" aria-label="Klang an oder aus">♪ Klang</button>
	<div class="kasten">
		<h1>HERZ UND FEDER</h1>
		<div class="unter">DIE ZWÖLF STUNDEN DER NACHT · FASSUNG 4.0.4</div>
		<div class="leiste" id="leiste"><i id="balken"></i></div>
		<div class="zeile"><span id="was">Die Barke wird beladen …</span><span id="wieviel"></span></div>
		<div id="spruch"></div>
		<div id="tipp">Tippe irgendwo, um die Nacht zu hören</div>
		<div id="status-notice"></div>
	</div>
</div>
<script src="$GODOT_URL"></script>
<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);
(function () {
	const huelle = document.getElementById('status');
	const leiste = document.getElementById('leiste');
	const balken = document.getElementById('balken');
	const was = document.getElementById('was');
	const wieviel = document.getElementById('wieviel');
	const spruch = document.getElementById('spruch');
	const notiz = document.getElementById('status-notice');
	const SPRUECHE = [
		'„Leicht wie die Feder der Maat soll dein Herz sein.“',
		'Die Sonne fährt in der Barke durch zwölf Stunden der Nacht.',
		'Wer die Namen der Tore kennt, dem öffnen sie sich.',
		'Die Jägerin jagt nie allein: ihr Fuchs ist schneller als jeder Pfeil.',
		'Die Ba-Seele flattert dorthin, wo ein Name vergessen wurde.',
		'Feuerschalen erinnern sich an jeden, der sie entzündet.',
	];
	let n = Math.floor(Math.random() * SPRUECHE.length), fertig = false, fehler = false;
	function naechster() {
		spruch.style.opacity = 0;
		setTimeout(() => { spruch.textContent = SPRUECHE[n++ % SPRUECHE.length]; spruch.style.opacity = 1; }, 450);
	}
	naechster();
	const uhr = setInterval(naechster, 4200);
	// Ladeklang: Browser spielen erst nach einer Berührung oder einem Klick Ton ab (das iPhone erst recht).
	// Darum startet er mit der ersten Geste auf der Seite; der Knopf oben rechts schaltet ihn an und aus,
	// die Wahl bleibt für den nächsten Besuch gemerkt. Web Audio statt <audio loop>, damit die Schleife ohne Lücke läuft.
	const knopf = document.getElementById('ton');
	const tipp = document.getElementById('tipp');
	let ctx = null, pegel = null, quelle = null, an = true, geladen = null, fertigWeg = false;
	try { an = localStorage.getItem('hf_ladeklang') !== 'aus'; } catch (e) {}
	function knopfZeigen() { knopf.textContent = an ? '♪ Klang' : '♪ Stille'; knopf.classList.toggle('aus', !an); }
	knopfZeigen();
	function starten() {
		if (quelle || !an || fertigWeg) return;
		try {
			const AC = window.AudioContext || window.webkitAudioContext;
			if (!AC) return;
			if (!ctx) {
				ctx = new AC();
				pegel = ctx.createGain();
				pegel.gain.value = 0;
				pegel.connect(ctx.destination);

			geladen.then(puffer => {
				if (quelle || !an || fertigWeg) return;
				quelle = ctx.createBufferSource();
				quelle.buffer = puffer;
				quelle.loop = true;
				quelle.loopStart = 0.1;
				quelle.loopEnd = Math.min(30.1, puffer.duration - 0.05);
				quelle.connect(pegel);
				quelle.start(0, 0.1);
				pegel.gain.cancelScheduledValues(ctx.currentTime);
				pegel.gain.setValueAtTime(pegel.gain.value, ctx.currentTime);
				pegel.gain.linearRampToValueAtTime(0.75, ctx.currentTime + 3.0);
			}).catch(e => console.warn('Ladeklang', e));
			tipp.style.opacity = 0;
		} catch (e) { console.warn('Ladeklang', e); }
	}
	function ausblenden(dauer) {
		if (!ctx || !quelle) return;
		const q = quelle;
		quelle = null;
		pegel.gain.cancelScheduledValues(ctx.currentTime);
		pegel.gain.setValueAtTime(pegel.gain.value, ctx.currentTime);
		pegel.gain.linearRampToValueAtTime(0, ctx.currentTime + dauer);
		setTimeout(() => { try { q.stop(); } catch (e) {} }, dauer * 1000 + 100);
	}
	['pointerdown', 'touchend', 'keydown', 'click'].forEach(art => document.addEventListener(art, starten, { capture: true, passive: true }));
	knopf.addEventListener('click', ev => {
		ev.stopPropagation();
		an = !an;
		try { localStorage.setItem('hf_ladeklang', an ? 'an' : 'aus'); } catch (e) {}
		knopfZeigen();
		if (an) starten(); else ausblenden(0.6);
	});
	document.addEventListener('visibilitychange', () => {
		if (!ctx || fertigWeg) return;
		if (document.hidden) ctx.suspend(); else ctx.resume();
	});
	if (!an) tipp.style.opacity = 0;
	function mb(b) { return (b / 1048576).toFixed(b < 10485760 ? 1 : 0); }
	function fehlschlag(err) {
		console.error(err);
		fehler = true;
		clearInterval(uhr);
		notiz.textContent = (err instanceof Error) ? err.message : (typeof err === 'string' ? err : 'Ein unbekannter Fehler ist aufgetreten.');
		notiz.style.display = 'block';
		was.textContent = 'Die Barke ist auf Grund gelaufen.';
	}
	function weg() {
		if (fehler) return;
		clearInterval(uhr);
		// das Spiel bringt seine eigene Musik mit: der Ladeklang verklingt sanft und gibt den Klangkanal frei
		ausblenden(2.5);
		fertigWeg = true;
		tipp.style.opacity = 0;
		knopf.style.opacity = 0;
		setTimeout(() => { if (ctx) ctx.close(); }, 3000);
		huelle.classList.add('weg');
		setTimeout(() => huelle.remove(), 650);
	}
	const fehlt = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (fehlt.length !== 0) {
		fehlschlag('Diesem Browser fehlt etwas, das das Spiel braucht:\n' + fehlt.join('\n'));
		return;
	}
	// Neue Fassung holen (4.0.3): Das Spiel ist eine installierbare Web-App; ihr Zwischenspeicher liefert sonst die alte
	// Fassung, bis alle Tabs geschlossen waren. Darum vor dem Start nachsehen, ob eine neue bereitliegt, und sie sofort
	// einsetzen (die Seite lädt dann einmal neu). Ohne Netz geht es nach vier Sekunden mit der vorhandenen weiter.
	async function frisch() {
		if (!('serviceWorker' in navigator)) return;
		try {
			const reg = await navigator.serviceWorker.getRegistration();
			if (!reg) return;
			await Promise.race([reg.update(), new Promise(r => setTimeout(r, 4000))]);
			const neu = reg.installing || reg.waiting;
			const alt = (await caches.keys()).length > 0;
			if (!neu && !alt) return;
			was.textContent = 'Eine neue Fassung wird geholt …';
			if (neu) {
				await new Promise(r => {
					if (neu.state === 'activated') { r(); return; }
					neu.addEventListener('statechange', () => { if (neu.state === 'activated' || neu.state === 'redundant') r(); });
					setTimeout(r, 10000);
				});
				if (reg.waiting) reg.waiting.postMessage('update');
			}
			// alte Speicher leeren und einmal frisch laden (der Merker verhindert, dass das zweimal geschieht)
			await Promise.all((await caches.keys()).map(k => caches.delete(k)));
			if (!sessionStorage.getItem('hf_frisch')) {
				sessionStorage.setItem('hf_frisch', '1');
				location.replace(location.pathname);
				await new Promise(() => {});
			}
		} catch (e) { console.warn('Fassung prüfen', e); }
	}
	frisch().then(() => engine.startGame({
		'onProgress': function (jetzt, gesamt) {
			if (jetzt > 0 && gesamt > 0) {
				leiste.classList.remove('offen');
				const p = Math.min(1, jetzt / gesamt);
				balken.style.width = (p * 100).toFixed(1) + '%';
				wieviel.textContent = mb(jetzt) + ' / ' + mb(gesamt) + ' MB';
				if (p >= 1 && !fertig) {
					fertig = true;
					was.textContent = 'Die Waage wird aufgestellt …';
				}
			} else {
				leiste.classList.add('offen');
				wieviel.textContent = jetzt > 0 ? mb(jetzt) + ' MB' : '';
			}
		},
	})).then(weg, fehlschlag);
}());
</script>
